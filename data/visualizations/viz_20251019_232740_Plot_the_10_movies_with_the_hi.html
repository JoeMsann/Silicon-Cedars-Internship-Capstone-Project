<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 10 Movies by Rental Rate</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chart-container {
            position: relative;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 1000px;
            height: 70vh;
            max-height: 600px;
        }
        canvas {
            max-height: 100%;
        }
        h1 {
            color: #1f2937;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
            "labels": [
                        "ACE GOLDFINGER",
                        "AIRPLANE SIERRA",
                        "AIRPORT POLLOCK",
                        "ALADDIN CALENDAR",
                        "ALI FOREVER",
                        "AMELIE HELLFIGHTERS",
                        "AMERICAN CIRCUS",
                        "ANTHEM LUKE",
                        "APACHE DIVINE",
                        "APOCALYPSE FLAMINGOS"
            ],
            "datasets": [
                        {
                                    "label": "rental_rate",
                                    "data": [
                                                4.99,
                                                4.99,
                                                4.99,
                                                4.99,
                                                4.99,
                                                4.99,
                                                4.99,
                                                4.99,
                                                4.99,
                                                4.99
                                    ],
                                    "backgroundColor": "#3b82f6",
                                    "borderColor": "#3b82f6",
                                    "borderWidth": 2,
                                    "fill": true
                        }
            ]
},
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'Top 10 Movies by Rental Rate',
                        font: { size: 18, weight: 'bold' },
                        padding: { bottom: 30 }
                    },
                    legend: {
                        display: true,
                        position: 'top',
                        labels: {
                            padding: 15,
                            font: { size: 12 }
                        }
                    },
                    tooltip: {
                        enabled: true,
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        padding: 12,
                        cornerRadius: 8,
                        titleFont: { size: 14, weight: 'bold' },
                        bodyFont: { size: 13 },
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                const value = context.parsed.y !== undefined ? context.parsed.y : context.parsed;
                                if (typeof value === 'number') {
                                    label += value.toLocaleString();
                                }
                                return label;
                            }
                        }
                    }
                },
            scales: {
                
                y: {
                    beginAtZero: true
                }
            },
                animation: {
                    duration: 1000,
                    easing: 'easeInOutQuart'
                }
            }
        });
    </script>
</body>
</html>
